<!doctype html><html lang="id"><head><base target="_top"><meta charset="utf-8"><style>
:root{--g:#14532d;--g2:#15803d;--gold:#c49a45;--bg:#f3f7f3;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17251b}button,input,select,textarea{font:inherit}button{background:linear-gradient(120deg,var(--g),var(--g2));color:#fff;border:0;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:bold}button.alt{background:#e7f0e8;color:var(--g)}button.red{background:#b91c1c}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#dcedd6,transparent 30%),linear-gradient(130deg,#103b23,#16713b 65%,#b18a40)}.loggrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(900px,100%)}.card{background:white;border-radius:18px;padding:25px;box-shadow:0 15px 45px #0002}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:bold;color:#475569}.field input,.field select,.field textarea{padding:11px;border:1px solid #d7e2d8;border-radius:9px;width:100%}.app{display:none}.top{background:linear-gradient(100deg,#104326,#16713b 70%,#b18a40);color:white;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:4}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 58px)}aside{background:#103b23;padding:14px}aside button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;color:#e5f1e7}aside button.sel,aside button:hover{background:#ffffff20}main{padding:22px;min-width:0}.hero{background:linear-gradient(110deg,#14532d,#23834b 72%,#c49a45);color:white;border-radius:16px;padding:20px;margin-bottom:16px}.panel,.stat{background:white;border:1px solid #e2eae3;border-radius:14px;padding:16px;margin:13px 0;overflow:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:26px;color:var(--g);display:block}.muted{color:var(--muted);font-size:13px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #e7eee8;padding:9px;vertical-align:top}th{background:#f4f8f4}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:15px}.modal>div{background:white;border-radius:16px;padding:20px;width:min(680px,100%);max-height:90vh;overflow:auto}.q{background:white;border-radius:14px;padding:18px;margin:14px 0}.option{display:block;padding:10px;border:1px solid #dce6dd;border-radius:9px;margin:7px 0}.toast{position:fixed;bottom:18px;right:18px;background:#17251b;color:white;padding:12px;border-radius:9px;display:none;z-index:30}.hide{display:none!important}@media(max-width:760px){.loggrid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto}aside button{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr 1fr}main{padding:12px}}
</style></head><body>
<div id="login" class="login"><div style="width:min(900px,100%)"><h1 style="color:white;text-align:center">✦ CBT MADRASAH · MIN 1 POSO</h1><div class="loggrid"><div class="card"><h2>Portal Siswa</h2><p class="muted">Login untuk mengikuti ujian.</p><div class="field"><label>Username</label><input id="su"></div><div class="field"><label>Password</label><input id="sp" type="password"></div><button style="width:100%" onclick="login('student')">LOGIN SISWA</button></div><div class="card"><h2>Portal Admin / Guru / Proktor</h2><p class="muted">Kelola administrasi dan asesmen madrasah.</p><div class="field"><label>Username</label><input id="au"></div><div class="field"><label>Password</label><input id="ap" type="password"></div><button style="width:100%" onclick="login('staff')">LOGIN PETUGAS</button></div></div><p style="color:white;text-align:center">Kementerian Agama Republik Indonesia</p></div></div>
<div id="app" class="app"><header class="top"><b>✦ CBT MIN 1 POSO</b><span><span id="who"></span> <button class="alt" onclick="logout()">Keluar</button></span></header><div class="layout"><aside id="nav"></aside><main id="main"></main></div></div>
<div id="modal" class="modal"><div><div class="row" style="justify-content:space-between"><h3 id="mt"></h3><button class="alt" onclick="closeModal()">Tutup</button></div><div id="mb"></div></div></div><div id="toast" class="toast"></div>
<script>
let T='',U=null,D={},S={},PAGE='dashboard',EX=null,TIMER=null,DEADLINE=0;

// ==========================================
// PASTE URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
const API_URL = 'https://script.google.com/macros/s/AKfycbzsPT_6Z-39FM7kudNKJVHo9mNEuZC85KeSzuXiZb1uJKRL9RZwKAf0ZYHN2vq_Os0vAQ/exec'; 
// ==========================================

const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(f, ...a) {
  const payload = JSON.stringify({ action: f, args: [T, ...a] });
  const formData = new URLSearchParams();
  formData.append('data', payload);
  const response = await fetch(API_URL, { method: 'POST', body: formData });
  const json = await response.json();
  if (json.status === 'error') throw new Error(json.message);
  return json.data;
}

function msg(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
async function login(k){try{let x=await api('login',$(k==='student'?'su':'au').value,$(k==='student'?'sp':'ap').value,k);T=x.token;U=x.user;S=x.settings;await startApp()}catch(e){msg(e.message||e)}}
async function startApp(){$('login').style.display='none';$('app').style.display='block';$('who').textContent=U.name+' · '+U.role;await refresh();nav();page('dashboard')}
async function refresh(){let x=await api('bootstrap');D=x.data;S=x.settings}
async function logout(){try{await api('logout')}catch(e){}location.reload()}
function nav(){let a=U.role==='SISWA'?[['dashboard','Beranda'],['essays','Ujian Saya'],['password','Ganti Password']]:[['dashboard','Dashboard'],['master','Master Data'],['credentials','Kartu Login Ujian'],['questions','Bank Soal'],['exams','Tes & Jadwal'],['participants','Peserta Ujian'],['monitor','Monitoring'],['results','Hasil & Koreksi Esai'],['analysis','Analisis Butir Soal'],['reports','Laporan'],['settings','Pengaturan'],['users','Manajemen Pengguna'],['backup','Backup & Restore']];if(U.role!=='ADMIN')a=a.filter(x=>x[0]!=='credentials');$('nav').innerHTML=a.map(x=>`<button id="n_${x[0]}" onclick="page('${x[0]}')">${x[1]}</button>`).join('')}
async function page(p){PAGE=p;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('sel'));if($('n_'+p))$('n_'+p).classList.add('sel');if(U.role==='SISWA'){if(p==='password')return passwordPage();return studentPage()}
const title={dashboard:'Dashboard',master:'Master Data',questions:'Bank Soal',exams:'Tes & Penjadwalan',participants:'Peserta Ujian',monitor:'Monitoring Ujian',results:'Hasil Ujian & Koreksi Esai',analysis:'Analisis Butir Soal',reports:'Laporan',settings:'Pengaturan',users:'Manajemen Pengguna',backup:'Backup & Restore'}[p]||p;
$('main').innerHTML=`<div class="hero"><h2>${title}</h2><div>${esc(S.schoolName||'Madrasah Ibtidaiyah Negeri 1 Poso')} · Tahun Pelajaran ${esc(S.academicYear||'')}</div></div><div id="body"></div>`;
if(p==='dashboard')dashboard();if(p==='master')master();if(p==='credentials')credentials();if(p==='questions')tablePage('questions');if(p==='exams')tablePage('exams');if(p==='participants')participants();if(p==='monitor')monitor();if(p==='results')results();if(p==='analysis')analysis();if(p==='reports')reports();if(p==='settings')settings();if(p==='users')tablePage('users');if(p==='backup')backup();}
function dashboard(){$('body').innerHTML=`<div class="stats">${[['students','Siswa'],['teachers','Guru'],['exams','Paket ujian'],['attempts','Sesi ujian']].map(([k,l])=>`<div class="stat"><b>${D[k].length}</b><span class="muted">${l}</span></div>`).join('')}</div><div class="panel"><h3>Selamat datang, ${esc(U.name)}</h3><p class="muted">Pastikan data kelas, peserta, bank soal, dan jadwal sudah tervalidasi sebelum ujian dimulai.</p></div>`}
const C={students:{title:'Siswa',f:[['nis','NIS'],['name','Nama'],['classId','ID Kelas'],['username','Username'],['active','Aktif TRUE/FALSE']]},teachers:{title:'Guru',f:[['nip','NIP'],['name','Nama'],['username','Username'],['active','Aktif']]},classes:{title:'Kelas/Rombel',f:[['name','Nama kelas'],['level','Tingkat'],['groupName','Rombel'],['active','Aktif']]},subjects:{title:'Mata Pelajaran',f:[['code','Kode'],['name','Nama mapel'],['classLevel','ID Kelas'],['teacherId','ID Guru'],['active','Aktif']]},terms:{title:'Tahun Pelajaran/Semester',f:[['schoolYear','Tahun pelajaran'],['semester','Semester'],['active','Aktif']]},questions:{title:'Bank Soal',f:[['subjectId','ID Mapel'],['classLevel','ID Kelas'],['type','PG/PG_KOMPLEKS/ESSAI/ISIAN/MENJODOHKAN'],['question','Pertanyaan'],['options','Opsi JSON'],['answer','Kunci (value)'],['weight','Bobot'],['imageUrl','URL gambar']]},exams:{title:'Paket Ujian',f:[['title','Nama ujian'],['subjectId','ID Mapel'],['classIds','ID kelas (koma)'],['studentIds','ID siswa (opsional)'],['startAt','Mulai YYYY-MM-DD HH:mm:ss'],['endAt','Selesai YYYY-MM-DD HH:mm:ss'],['durationMin','Durasi menit'],['questionCount','Jumlah soal'],['token','Token'],['shuffleQuestions','Acak soal TRUE/FALSE'],['shuffleOptions','Acak opsi TRUE/FALSE'],['status','AKTIF/NONAKTIF']]},users:{title:'Akun Pengguna',f:[['username','Username'],['password','Password (buat/reset)'],['name','Nama'],['role','ADMIN/GURU/PROKTOR/SISWA'],['active','TRUE/FALSE'],['classId','ID kelas siswa']]}}
function accountIdForRow(k,r){
 if(k==='users')return r.id;
 if(!['students','teachers'].includes(k))return '';
 const role=k==='students'?'SISWA':'GURU';
 const u=(D.users||[]).find(x=>String(x.username)===String(r.username)&&x.role===role);
 return u?u.id:'';
}
function tablePage(k){
 let c=C[k],a=D[k]||[];
 $('body').innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>${c.title}</h3><button onclick="formRow('${k}')">＋ Tambah</button></div><div style="overflow:auto"><table><tr>${c.f.filter(x=>x[0]!=='password').map(x=>`<th>${x[1]}</th>`).join('')}<th>Aksi</th></tr>${a.map(r=>{let accountId=accountIdForRow(k,r);return `<tr>${c.f.filter(x=>x[0]!=='password').map(x=>`<td>${esc(r[x[0]])}</td>`).join('')}<td><button class="alt" onclick="formRow('${k}','${r.id}')">Edit</button> ${U.role==='ADMIN'?`${accountId?`<button onclick="resetOnePassword('${accountId}')">Reset & Cetak Kartu</button>`:''} <button class="red" onclick="delRow('${k}','${r.id}')">Hapus</button>`:''}</td></tr>`}).join('')}</table></div></div>${k==='questions'?importPanel():''}${['students','teachers'].includes(k)?peopleImportPanel(k):''}`
}
function importPanel(){return `<div class="panel"><h3>Impor Soal dari Tabel Excel</h3><p class="muted">Gunakan file TEMPLATE_IMPORT_SOAL.xlsx. Isi satu soal per baris pada sheet BANK_SOAL; jangan mengubah nama header pada baris pertama. Kolom JENIS_SOAL harus memakai kode: PG, PG_KOMPLEKS, BENAR_SALAH, ISIAN, ESSAI, atau MENJODOHKAN. Untuk PG kompleks, KUNCI_JAWABAN contoh A,C. Untuk menjodohkan, isi PASANGAN_JSON dan KUNCI_JAWABAN dalam JSON sesuai petunjuk di sheet PETUNJUK.</p><div class="field"><label>Mata pelajaran</label><select id="impSubject">${D.subjects.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.id)})</option>`)}</select></div><div class="field"><label>Kelas sasaran</label><select id="impClass">${D.classes.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.id)})</option>`)}</select></div><div class="field"><label>Pilih file Excel (.xlsx / .xls)</label><input type="file" id="impFile" accept=".xlsx,.xls"></div><button onclick="doImport()">Impor & Validasi Soal</button><div id="impResult"></div></div>`}

function peopleImportPanel(kind){let student=kind==='students';return `<div class="panel"><h3>Impor Massal ${student?'Data Siswa':'Data Guru'}</h3><p class="muted">Gunakan TEMPLATE_IMPORT_SISWA.xlsx atau TEMPLATE_IMPORT_GURU.xlsx. Isi satu orang per baris pada sheet pertama dan jangan mengubah header. Kolom wajib: ${student?'NIS, NAMA, ID_KELAS':'NIP, NAMA'}. USERNAME, PASSWORD, AKTIF opsional. Format NIS/NIP sebagai teks agar angka nol di depan tidak hilang. Baris contoh pada template boleh diganti atau dihapus.</p><div class="field"><label>File Excel (.xlsx / .xls)</label><input id="peopleFile" type="file" accept=".xlsx,.xls"></div><button onclick="doPeopleImport('${kind}')">Impor Data dan Buat Akun</button><div id="peopleResult"></div></div>`}
function downloadPeopleTemplate(kind){let r=kind==='students'?[['NIS','NAMA','ID_KELAS','USERNAME','PASSWORD','AKTIF'],['123456','Nama Siswa','ISI_ID_KELAS','','','TRUE']]:[['NIP','NAMA','USERNAME','PASSWORD','AKTIF'],['198001012005011001','Nama Guru','','','TRUE']];let csv=r.map(x=>x.map(v=>'"'+v+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='template_'+kind+'_cbt_min1_poso.csv';a.click()}
async function doPeopleImport(kind){let f=$('peopleFile').files[0];if(!f)return msg('Pilih file terlebih dahulu.');let rd=new FileReader();rd.onload=async()=>{try{let r=await api('importPeople',kind,f.name,f.type||'application/octet-stream',rd.result.split(',')[1]);window._importCards=r.cards;$('peopleResult').innerHTML=`<p>Baru ${r.added} · Diperbarui ${r.updated} · Gagal ${r.totalErrors}</p>${r.errors.map(x=>`<div>${esc(x)}</div>`).join('')}<button onclick="printCards(window._importCards)">Cetak Kartu Login Hasil Impor</button>`;await refresh()}catch(e){msg(e.message)}};rd.readAsDataURL(f)}
function credentials(){
 const rows=[...(D.students||[]).filter(x=>String(x.active).toUpperCase()!=='FALSE').map(x=>({kind:'SISWA',name:x.name,identity:x.nis,classId:x.classId,username:x.username,accountId:accountIdForRow('students',x)})),...(D.teachers||[]).filter(x=>String(x.active).toUpperCase()!=='FALSE').map(x=>({kind:'GURU',name:x.name,identity:x.nip,classId:'',username:x.username,accountId:accountIdForRow('teachers',x)}))].filter(x=>x.accountId);
 $('body').innerHTML=`<div class="panel"><h3>Cetak Kartu Login Ujian</h3><p class="muted">Reset hanya berlaku untuk satu akun yang dipilih. Password akun lain tidak berubah. Setelah reset, satu kartu login baru disiapkan untuk dicetak.</p><div style="overflow:auto"><table><tr><th>Jenis</th><th>Nama</th><th>NIS/NIP</th><th>ID Kelas</th><th>Username</th><th>Aksi</th></tr>${rows.map(x=>`<tr><td>${esc(x.kind)}</td><td>${esc(x.name)}</td><td>${esc(x.identity)}</td><td>${esc(x.classId)}</td><td>${esc(x.username)}</td><td><button onclick="resetOnePassword('${x.accountId}')">Reset & Cetak Kartu</button></td></tr>`).join('')}</table></div>${rows.length?'':'<p class="muted">Belum ada akun siswa/guru aktif yang terhubung.</p>'}</div>`
}
async function resetOnePassword(userId){
 if(!confirm('Reset password hanya untuk akun yang dipilih. Password akun lain tetap. Lanjutkan?'))return;
 try{
  const card=await api('resetSingleUserPassword',userId);
  printCards([card]);
  await refresh();
  if(PAGE==='credentials')credentials();
  else if(['users','students','teachers'].includes(PAGE))page(PAGE);
  msg('Password akun terpilih berhasil direset. Cetak dan serahkan kartu baru secara pribadi.')
 }catch(e){msg(e.message)}
}
function printCards(cards){if(!cards||!cards.length)return;let w=window.open('','_blank');if(!w)return msg('Izinkan pop-up untuk mencetak.');let items=cards.map(c=>`<article><small>KEMENTERIAN AGAMA RI · ${esc(S.schoolName||'MIN 1 POSO')}</small><h3>KARTU LOGIN UJIAN CBT</h3><b class="name">${esc(c.name)}</b><p>${esc(c.kind)} · ${esc(c.identity)} ${c.classId?'· Kelas '+esc(c.classId):''}</p><div>USERNAME <strong>${esc(c.username)}</strong></div><div>PASSWORD <strong>${esc(c.password)}</strong></div><small>Simpan kartu ini secara pribadi.</small></article>`).join('');w.document.write(`<html><head><meta charset="utf-8"><title>Kartu Login CBT</title><style>body{font-family:Arial;margin:10mm}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm}article{border:2px solid #14532d;border-radius:8px;padding:12px;break-inside:avoid}h3{text-align:center;color:#14532d}.name{display:block;text-align:center;font-size:16px}article div{padding:8px;margin:6px 0;border:1px dashed #888;display:flex;justify-content:space-between}strong{font-family:monospace;font-size:15px}@media print{article{page-break-inside:avoid}}</style></head><body><div class="grid">${items}</div><script>onload=()=>print()<\/script></body></html>`);w.document.close()}

function formRow(k,id){let c=C[k],r=(D[k]||[]).find(x=>x.id===id)||{};$('mt').textContent=(id?'Edit ':'Tambah ')+c.title;$('mb').innerHTML=`<form onsubmit="saveRow(event,'${k}','${id||''}')">${c.f.map(([f,l])=>`<div class="field"><label>${l}</label>${f==='question'?`<textarea name="${f}" rows="4">${esc(r[f]||'')}</textarea>`:f==='type'?`<select name="type" onchange="typeHelp(this.value)"><option value="PG">Pilihan Ganda — satu jawaban benar</option><option value="PG_KOMPLEKS">Pilihan Ganda Kompleks — beberapa jawaban benar</option><option value="BENAR_SALAH">Benar / Salah</option><option value="ISIAN">Isian singkat — teks/angka</option><option value="ESSAI">Uraian / Esai — dinilai guru</option><option value="MENJODOHKAN">Menjodohkan — pasangan</option></select>`:`<input name="${f}" value="${esc(f==='password'?'':r[f]||'')}" ${['weight','durationMin','questionCount'].includes(f)?'type="number"':''} ${f==='password'?'type="password"':''}>`}</div>`).join('')}<div id="typeHelp" class="muted"></div><button>Simpan</button></form>`;if(k==='questions'){$('mb').querySelector('[name=type]').value=r.type||'PG';typeHelp(r.type||'PG')} $('modal').style.display='flex'}
function typeHelp(t){let m={PG:'Opsi berupa JSON array. Kunci adalah value dari satu opsi, misalnya A.',PG_KOMPLEKS:'Opsi berupa JSON array. Kunci berupa JSON array value, misalnya ["A","C"].',BENAR_SALAH:'Kunci jawaban harus BENAR atau SALAH.',ISIAN:'Opsi dikosongkan. Kunci berupa teks/angka yang dicocokkan.',ESSAI:'Opsi dikosongkan. Jawaban dinilai manual oleh guru berdasarkan rubrik.',MENJODOHKAN:'Opsi dan kunci harus disusun sebagai pasangan JSON yang konsisten.'};$('typeHelp').textContent=m[t]||''}
async function saveRow(e,k,id){e.preventDefault();let o={};new FormData(e.target).forEach((v,k)=>o[k]=v);if(id)o.id=id;try{await api('saveRecord',k,o);closeModal();await refresh();page(PAGE);msg('Data tersimpan.')}catch(x){msg(x.message)}}
async function delRow(k,id){if(!confirm('Hapus data ini?'))return;try{await api('deleteRecord',k,id);await refresh();page(PAGE)}catch(e){msg(e.message)}}
function closeModal(){$('modal').style.display='none'}
function master(){$('body').innerHTML=`<div class="stats">${['students','teachers','classes','subjects','terms'].map(k=>`<div class="stat"><b>${D[k].length}</b><span>${C[k].title}</span><p><button class="alt" onclick="tablePage('${k}')">Kelola</button></p></div>`).join('')}</div>`}
async function doImport(){const f=$('impFile').files[0];if(!f)return msg('Pilih file terlebih dahulu.');const reader=new FileReader();reader.onload=async()=>{try{const b=reader.result.split(',')[1],r=await api('importQuestions',f.name,f.type||'application/octet-stream',b,$('impSubject').value,$('impClass').value);$('impResult').innerHTML=`<p>Berhasil impor: <b>${r.added}</b>. Kesalahan: ${r.totalErrors}</p>${r.errors.map(x=>`<div>${esc(x)}</div>`).join('')}`;await refresh()}catch(e){msg(e.message)}};reader.readAsDataURL(f)}
function participants(){$('body').innerHTML=`<div class="panel"><h3>Peserta Ujian</h3><p class="muted">Buat akun role SISWA dengan username yang sama dengan data siswa. ID kelas harus sesuai dengan ID kelas yang dipilih saat membuat soal dan paket ujian.</p><table><tr><th>NIS</th><th>Nama</th><th>Kelas ID</th><th>Username</th><th>Aktif</th></tr>${D.students.map(s=>`<tr><td>${esc(s.nis)}</td><td>${esc(s.name)}</td><td>${esc(s.classId)}</td><td>${esc(s.username)}</td><td>${esc(s.active)}</td></tr>`).join('')}</table></div>`}
async function monitor(){const a=await api('getMonitoring');$('body').innerHTML=`<div class="panel"><div class="row"><h3>Monitoring</h3><button class="alt" onclick="monitor()">Refresh</button></div><table><tr><th>Siswa</th><th>Kelas</th><th>Ujian</th><th>Status</th><th>Mulai</th><th>Terakhir aktif</th><th>Pelanggaran</th></tr>${a.map(x=>`<tr><td>${esc(x.student)}</td><td>${esc(x.classId)}</td><td>${esc(x.exam)}</td><td>${esc(x.status)}</td><td>${esc(x.startedAt)}</td><td>${esc(x.lastSeen)}</td><td>${esc(x.violations)}</td></tr>`).join('')}</table></div>`}
async function results(){const [a,q]=await Promise.all([api('reportData'),api('essayQueue')]);window._reports=a;window._essay=q;$('body').innerHTML=`<div class="panel"><div class="row"><h3>Rekap Nilai</h3><button onclick="csv()">Ekspor CSV/Excel</button></div><table><tr><th>Siswa</th><th>NIS</th><th>Kelas</th><th>Ujian</th><th>Status</th><th>Nilai</th></tr>${a.map(x=>`<tr><td>${esc(x.student)}</td><td>${esc(x.nis)}</td><td>${esc(x.classId)}</td><td>${esc(x.exam)}</td><td>${esc(x.status)}</td><td>${esc(x.score)}</td></tr>`).join('')}</table></div><div class="panel"><h3>Koreksi Esai</h3>${q.map(x=>`<div class="q"><b>${esc(x.student)} · ${esc(x.exam)}</b><p class="muted">Attempt ${esc(x.attemptId)}</p>${x.questions.map(z=>`<p><b>Soal:</b> ${esc(z.question)} (Bobot ${z.weight})<br><b>Jawaban siswa:</b> ${esc(z.answer||'(kosong)')}</p><div class="field"><label>Nilai (maks ${z.weight})</label><input type="number" min="0" max="${Number(z.weight)}" step="0.1" id="grade_${x.attemptId}_${z.id}" value="${esc(x.grades[z.id]??0)}"></div>`).join('')}<button onclick="grade('${x.attemptId}','${x.studentId}',${JSON.stringify(x.questions.map(z=>z.id))})">Simpan Koreksi</button></div>`).join('')||'<p class="muted">Tidak ada jawaban esai yang menunggu koreksi.</p>'}</div>`}
async function grade(a,s,ids){let o={};ids.forEach(id=>o[id]=$(`grade_${a}_${id}`).value);try{let r=await api('gradeEssay',a,s,o,'Koreksi guru');msg('Nilai akhir diperbarui: '+r.score);results()}catch(e){msg(e.message)}}
function csv(){let a=window._reports||[],rows=[['Siswa','NIS','Kelas','Ujian','Status','Nilai','Pelanggaran','Selesai'],...a.map(x=>[x.student,x.nis,x.classId,x.exam,x.status,x.score,x.violations,x.submittedAt])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let el=document.createElement('a');el.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));el.download='rekap-cbt-min1-poso.csv';el.click()}
async function analysis(){const opts=D.exams.map(e=>`<option value="${esc(e.id)}">${esc(e.title)}</option>`).join('');$('body').innerHTML=`<div class="panel"><h3>Analisis Butir Soal</h3><div class="field"><label>Pilih paket ujian</label><select id="analysisExam">${opts}</select></div><button onclick="runAnalysis()">Hitung Analisis</button><div id="analysisResult"></div><p class="muted">Indeks kesukaran = proporsi benar. Daya pembeda = proporsi benar kelompok atas dikurangi kelompok bawah (masing-masing sekitar 27%). Interpretasi perlu hati-hati untuk jumlah peserta kecil dan soal esai.</p></div>`}
async function runAnalysis(){try{let a=await api('itemAnalysis',$('analysisExam').value);$('analysisResult').innerHTML=`<table><tr><th>Soal</th><th>Jenis</th><th>Menjawab</th><th>Kesukaran</th><th>Interpretasi</th><th>Daya pembeda</th><th>Interpretasi</th><th>Distribusi jawaban</th></tr>${a.map(x=>`<tr><td>${esc(x.question)}</td><td>${esc(x.type)}</td><td>${x.answered}/${x.total}</td><td>${x.difficulty}</td><td>${x.difficultyLabel}</td><td>${x.discrimination}</td><td>${x.discriminationLabel}</td><td>${esc(JSON.stringify(x.distribution))}</td></tr>`).join('')}</table>`}catch(e){msg(e.message)}}
function reports(){results()}
function settings(){$('body').innerHTML=`<div class="panel"><h3>Identitas Madrasah</h3><form onsubmit="saveSettings(event)">${[['schoolName','Nama madrasah'],['schoolAddress','Alamat'],['logoUrl','URL logo'],['academicYear','Tahun pelajaran'],['semester','Semester']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(S[k]||'')}"></div>`).join('')}<button>Simpan</button></form><p><button class="alt" onclick="passwordPage()">Ganti Password</button></p></div>`}
async function saveSettings(e){e.preventDefault();let o={};new FormData(e.target).forEach((v,k)=>o[k]=v);try{S=await api('updateSettings',o);msg('Pengaturan tersimpan.')}catch(x){msg(x.message)}}
function passwordPage(){$('main').innerHTML=`<div class="hero"><h2>Ganti Password</h2></div><div class="panel"><form onsubmit="changePass(event)"><div class="field"><label>Password lama</label><input name="old" type="password" required></div><div class="field"><label>Password baru (min. 10 karakter)</label><input name="newp" type="password" required></div><button>Simpan</button></form></div>`}
async function changePass(e){e.preventDefault();let f=new FormData(e.target);try{await api('changePassword',f.get('old'),f.get('newp'));msg('Password diubah.')}catch(x){msg(x.message)}}
async function backup(){let a=await api('listBackups');$('body').innerHTML=`<div class="panel"><h3>Backup Database</h3><p class="muted">Membuat salinan lengkap file spreadsheet database ke Google Drive.</p><button onclick="makeBackup()">Buat Backup Sekarang</button><div id="backupMsg"></div></div><div class="panel"><h3>Restore Database</h3><p class="muted">Restore akan mengganti seluruh data sheet dengan data dari backup. Sistem otomatis membuat salinan keselamatan database aktif sebelum restore.</p><div class="field"><label>ID File Backup Google Sheets</label><input id="restoreId" placeholder="Tempel file ID atau URL spreadsheet"></div><div class="field"><label>Ketik RESTORE MIN1 POSO untuk konfirmasi</label><input id="restoreConfirm"></div><button class="red" onclick="restore()">Pulihkan Database</button></div><div class="panel"><h3>Riwayat Backup</h3><table><tr><th>Tanggal</th><th>Nama file</th><th>File ID</th><th>Pembuat</th></tr>${a.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.fileName)}</td><td>${esc(x.fileId)}</td><td>${esc(x.createdBy)}</td></tr>`).join('')}</table></div>`}
async function makeBackup(){try{let x=await api('createBackup');$('backupMsg').innerHTML=`<p>Backup berhasil: <a target="_blank" href="${esc(x.url)}">${esc(x.name)}</a><br>ID: ${esc(x.fileId)}</p>`;msg('Backup selesai.')}catch(e){msg(e.message)}}
async function restore(){let id=$('restoreId').value.trim(),m=$('restoreConfirm').value.trim();const match=id.match(/[-\\w]{25,}/);if(match)id=match[0];if(!confirm('Semua data database aktif akan diganti. Lanjutkan?'))return;try{let x=await api('restoreBackup',id,m);msg('Restore berhasil. Salinan keselamatan dibuat.');$('backupMsg')&&($('backupMsg').textContent=x.safetyCopyUrl)}catch(e){msg(e.message)}}
async function studentPage(){let x=await api('studentLoginInfo');$('main').innerHTML=`<div class="hero"><h2>Assalamu'alaikum, ${esc(x.student.name)}</h2>Selamat mengikuti asesmen CBT MIN 1 POSO.</div><div class="panel"><h3>Ujian tersedia</h3>${x.exams.map(e=>`<div style="padding:13px;border-bottom:1px solid #eee"><b>${esc(e.title)}</b><p class="muted">${esc(e.startAt)} sampai ${esc(e.endAt)} · ${esc(e.durationMin)} menit</p><button onclick="begin('${e.id}')">Masuk Ujian</button></div>`).join('')||'Belum ada ujian tersedia.'}</div>`}
async function begin(id){let token=prompt('Masukkan token ujian. Jika tidak menggunakan token, kosongkan:')||'';try{EX=await api('beginExam',id,token);DEADLINE=Date.now()+EX.exam.durationMin*60000;renderExam()}catch(e){msg(e.message)}}
function renderExam(){document.body.innerHTML=`<div style="max-width:1000px;margin:20px auto;padding:16px"><div class="hero row" style="justify-content:space-between"><div><b>${esc(EX.exam.title)}</b><div>CBT MIN 1 POSO</div></div><b id="clock"></b></div><div id="questions"></div><button onclick="submit()">KIRIM JAWABAN</button><p id="saveStatus" class="muted">Jawaban disimpan otomatis.</p></div>`;$('questions').innerHTML=EX.questions.map((q,i)=>`<div class="q"><div class="muted">Soal ${i+1} · Bobot ${q.weight}</div><div style="white-space:pre-wrap;font-size:18px;line-height:1.6">${esc(q.question)}</div>${q.imageUrl?`<img src="${esc(q.imageUrl)}" style="max-width:100%;max-height:300px">`:''}${inputFor(q)}</div>`).join('');document.addEventListener('visibilitychange',()=>{if(document.hidden)violation('Berpindah tab/aplikasi')});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)violation('Keluar fullscreen')});try{document.documentElement.requestFullscreen()}catch(e){}TIMER=setInterval(()=>{let n=Math.max(0,DEADLINE-Date.now());$('clock').textContent=Math.floor(n/60000)+':'+String(Math.floor(n/1000)%60).padStart(2,'0');if(n<=0)submit(true)},1000)}
function inputFor(q){let a=EX.answers[q.id]??'';if(q.type==='PG')return q.options.map(o=>`<label class="option"><input type="radio" name="q_${q.id}" value="${esc(typeof o==='object'?o.value:o)}" ${String(a)===String(typeof o==='object'?o.value:o)?'checked':''} onchange="answer('${q.id}',this.value)"> ${esc(typeof o==='object'?o.label:o)}</label>`).join('');if(q.type==='BENAR_SALAH')return ['BENAR','SALAH'].map(v=>`<label class="option"><input type="radio" name="q_${q.id}" value="${v}" ${String(a)===v?'checked':''} onchange="answer('${q.id}',this.value)"> ${v}</label>`).join('');if(q.type==='PG_KOMPLEKS')return q.options.map(o=>`<label class="option"><input class="complex_${q.id}" type="checkbox" value="${esc(typeof o==='object'?o.value:o)}" ${Array.isArray(a)&&a.includes(typeof o==='object'?o.value:o)?'checked':''} onchange="complex('${q.id}')"> ${esc(typeof o==='object'?o.label:o)}</label>`).join('');return `<textarea id="ans_${q.id}" rows="3" style="width:100%;padding:10px" onchange="answer('${q.id}',this.value)">${esc(a)}</textarea>`}
async function answer(q,v){EX.answers[q]=v;try{await api('saveAnswer',EX.attemptId,q,v);$('saveStatus').textContent='Tersimpan ✓'}catch(e){$('saveStatus').textContent=e.message}}
function complex(q){answer(q,[...document.querySelectorAll('.complex_'+q+':checked')].map(x=>x.value))}
async function violation(s){if(EX)try{await api('examEvent',EX.attemptId,s)}catch(e){}let el=$('saveStatus');if(el)el.textContent='Peringatan tercatat: '+s}
let submitting=false;async function submit(auto){if(!EX||submitting)return;if(!auto&&!confirm('Yakin mengirim jawaban?'))return;submitting=true;clearInterval(TIMER);try{let r=await api('submitExam',EX.attemptId);document.exitFullscreen?.();document.body.innerHTML=`<div class="login" style="background:linear-gradient(120deg,#14532d,#15803d)"><div class="card" style="text-align:center"><h2>Ujian Selesai</h2><p>Jawaban berhasil dikirim.</p><h1>${r.score}</h1><p>${r.needsEssayReview?'Jawaban esai menunggu koreksi guru.':'Terima kasih.'}</p><button onclick="location.reload()">Kembali</button></div></div>`}catch(e){submitting=false;msg(e.message)}}
</script></body></html>
